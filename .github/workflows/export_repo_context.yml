name: Export Repository Context

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate repository full dump
        shell: bash
        run: |
          cat > /tmp/export_repo.py <<'PYTHON_SCRIPT'
          from pathlib import Path
          import subprocess


          ROOT = Path.cwd()
          OUTPUT_FILE = ROOT / "REPO_FULL_DUMP.txt"

          TEXT_EXTENSIONS = {
              ".py",
              ".pyi",
              ".js",
              ".jsx",
              ".ts",
              ".tsx",
              ".html",
              ".htm",
              ".css",
              ".scss",
              ".json",
              ".jsonl",
              ".csv",
              ".tsv",
              ".md",
              ".txt",
              ".yml",
              ".yaml",
              ".toml",
              ".ini",
              ".cfg",
              ".conf",
              ".xml",
              ".sql",
              ".sh",
              ".bash",
              ".ps1",
              ".bat",
          }

          SPECIAL_TEXT_FILES = {
              "Dockerfile",
              "Makefile",
              "Procfile",
              "requirements.txt",
              "runtime.txt",
              "package.json",
              "package-lock.json",
              "pyproject.toml",
              "poetry.lock",
              "Pipfile",
              "Pipfile.lock",
              ".gitignore",
              ".gitattributes",
              ".env.example",
          }

          EXCLUDED_FILE_NAMES = {
              "REPO_FULL_DUMP.txt",
              ".env",
              ".env.local",
              ".env.production",
              ".env.development",
              "credentials.json",
              "service-account.json",
              "service_account.json",
              "secrets.json",
          }

          EXCLUDED_DIRECTORY_NAMES = {
              ".git",
              "__pycache__",
              ".pytest_cache",
              ".mypy_cache",
              ".ruff_cache",
              "node_modules",
              ".venv",
              "venv",
              "dist",
              "build",
          }


          def get_tracked_files():
              result = subprocess.run(
                  ["git", "ls-files", "-z"],
                  check=True,
                  capture_output=True,
              )

              decoded = result.stdout.decode(
                  "utf-8",
                  errors="replace",
              )

              paths = []

              for name in decoded.split("\0"):
                  if not name:
                      continue

                  paths.append(ROOT / name)

              return paths


          def get_relative_path(path):
              return path.relative_to(ROOT).as_posix()


          def is_excluded(path):
              if path.name in EXCLUDED_FILE_NAMES:
                  return True

              relative_parts = path.relative_to(ROOT).parts

              for part in relative_parts:
                  if part in EXCLUDED_DIRECTORY_NAMES:
                      return True

              return False


          def is_text_candidate(path):
              if path.name in SPECIAL_TEXT_FILES:
                  return True

              if path.name.startswith(".env"):
                  return path.name == ".env.example"

              return path.suffix.lower() in TEXT_EXTENSIONS


          def read_text_file(path):
              try:
                  raw_data = path.read_bytes()
              except Exception as exc:
                  return None, "Unable to read file: {}".format(exc)

              if b"\x00" in raw_data:
                  return None, "Binary file detected"

              encodings = [
                  "utf-8",
                  "utf-8-sig",
                  "cp950",
                  "big5",
                  "latin-1",
              ]

              for encoding in encodings:
                  try:
                      return raw_data.decode(encoding), None
                  except UnicodeDecodeError:
                      continue

              return (
                  raw_data.decode("utf-8", errors="replace"),
                  "Some characters were replaced during decoding",
              )


          def mask_possible_secrets(content):
              sensitive_keywords = (
                  "api_key",
                  "apikey",
                  "api-key",
                  "token",
                  "secret",
                  "password",
                  "private_key",
                  "private-key",
                  "client_secret",
              )

              masked_lines = []

              for line in content.splitlines():
                  lowered = line.lower()

                  is_sensitive = any(
                      keyword in lowered
                      for keyword in sensitive_keywords
                  )

                  if not is_sensitive:
                      masked_lines.append(line)
                      continue

                  stripped = line.strip()

                  if stripped.startswith("#"):
                      masked_lines.append(line)
                      continue

                  if "secrets." in lowered:
                      masked_lines.append(line)
                      continue

                  separator = None

                  if "=" in line:
                      separator = "="
                  elif ":" in line:
                      separator = ":"

                  if separator is None:
                      masked_lines.append(line)
                      continue

                  key = line.split(separator, 1)[0]
                  masked_lines.append(
                      "{}{} [REDACTED BY EXPORT WORKFLOW]".format(
                          key,
                          separator,
                      )
                  )

              return "\n".join(masked_lines)


          tracked_files = sorted(
              get_tracked_files(),
              key=lambda path: get_relative_path(path).lower(),
          )

          included_files = []
          skipped_files = []

          for file_path in tracked_files:
              relative_path = get_relative_path(file_path)

              if not file_path.exists():
                  skipped_files.append(
                      (relative_path, "File does not exist")
                  )
                  continue

              if not file_path.is_file():
                  skipped_files.append(
                      (relative_path, "Not a regular file")
                  )
                  continue

              if is_excluded(file_path):
                  skipped_files.append(
                      (relative_path, "Excluded for safety")
                  )
                  continue

              if not is_text_candidate(file_path):
                  skipped_files.append(
                      (relative_path, "Non-text extension")
                  )
                  continue

              included_files.append(file_path)

          output_lines = [
              "=" * 100,
              "REPOSITORY FULL TEXT DUMP",
              "=" * 100,
              "",
              "Repository root: {}".format(ROOT.name),
              "Tracked files: {}".format(len(tracked_files)),
              "Included text files: {}".format(len(included_files)),
