name: Export Repository Context

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Export tracked text files
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_FILE="REPO_FULL_DUMP.txt"
          FILE_LIST="/tmp/repo_file_list.txt"
          INCLUDED_LIST="/tmp/repo_included_list.txt"
          SKIPPED_LIST="/tmp/repo_skipped_list.txt"

          rm -f "$OUTPUT_FILE"
          rm -f "$FILE_LIST"
          rm -f "$INCLUDED_LIST"
          rm -f "$SKIPPED_LIST"

          touch "$FILE_LIST"
          touch "$INCLUDED_LIST"
          touch "$SKIPPED_LIST"

          git ls-files > "$FILE_LIST"

          tracked_count="$(wc -l < "$FILE_LIST" | tr -d ' ')"

          is_excluded_file() {
            case "$1" in
              REPO_FULL_DUMP.txt)
                return 0
                ;;
              .env|.env.local|.env.production|.env.development)
                return 0
                ;;
              credentials.json|service-account.json|service_account.json)
                return 0
                ;;
              secrets.json)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_excluded_path() {
            case "$1" in
              .git/*|*/.git/*)
                return 0
                ;;
              node_modules/*|*/node_modules/*)
                return 0
                ;;
              __pycache__/*|*/__pycache__/*)
                return 0
                ;;
              .venv/*|*/.venv/*)
                return 0
                ;;
              venv/*|*/venv/*)
                return 0
                ;;
              dist/*|*/dist/*)
                return 0
                ;;
              build/*|*/build/*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_allowed_extension() {
            file_path="$1"
            file_name="$(basename "$file_path")"

            case "$file_name" in
              Dockerfile|Makefile|Procfile)
                return 0
                ;;
              requirements.txt|runtime.txt)
                return 0
                ;;
              package.json|package-lock.json)
                return 0
                ;;
              pyproject.toml|poetry.lock)
                return 0
                ;;
              Pipfile|Pipfile.lock)
                return 0
                ;;
              .gitignore|.gitattributes|.env.example)
                return 0
                ;;
            esac

            case "$file_path" in
              *.py|*.pyi)
                return 0
                ;;
              *.js|*.jsx|*.ts|*.tsx)
                return 0
                ;;
              *.html|*.htm|*.css|*.scss)
                return 0
                ;;
              *.json|*.jsonl)
                return 0
                ;;
              *.csv|*.tsv)
                return 0
                ;;
              *.md|*.txt)
                return 0
                ;;
              *.yml|*.yaml)
                return 0
                ;;
              *.toml|*.ini|*.cfg|*.conf)
                return 0
                ;;
              *.xml|*.sql)
                return 0
                ;;
              *.sh|*.bash|*.ps1|*.bat)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          while IFS= read -r file_path; do
            if [ -z "$file_path" ]; then
              continue
            fi

            file_name="$(basename "$file_path")"

            if [ ! -e "$file_path" ]; then
              printf '%s | File does not exist\n' "$file_path" \
                >> "$SKIPPED_LIST"
              continue
            fi

            if [ ! -f "$file_path" ]; then
              printf '%s | Not a regular file\n' "$file_path" \
                >> "$SKIPPED_LIST"
              continue
            fi

            if is_excluded_file "$file_name"; then
              printf '%s | Excluded for safety\n' "$file_path" \
                >> "$SKIPPED_LIST"
              continue
            fi

            if is_excluded_path "$file_path"; then
              printf '%s | Excluded directory\n' "$file_path" \
                >> "$SKIPPED_LIST"
              continue
            fi

            if ! is_allowed_extension "$file_path"; then
              printf '%s | Unsupported or binary extension\n' "$file_path" \
                >> "$SKIPPED_LIST"
              continue
            fi

            if ! grep -Iq . "$file_path" 2>/dev/null; then
              if [ -s "$file_path" ]; then
                printf '%s | Binary content detected\n' "$file_path" \
                  >> "$SKIPPED_LIST"
                continue
              fi
            fi

            file_size="$(stat -c '%s' "$file_path")"

            if [ "$file_size" -gt 20000000 ]; then
              printf '%s | Larger than 20 MB\n' "$file_path" \
                >> "$SKIPPED_LIST"
              continue
            fi

            printf '%s\n' "$file_path" >> "$INCLUDED_LIST"
          done < "$FILE_LIST"

          included_count="$(wc -l < "$INCLUDED_LIST" | tr -d ' ')"
          skipped_count="$(wc -l < "$SKIPPED_LIST" | tr -d ' ')"

          {
            printf '%s\n' \
              "===================================================================================================="
            printf '%s\n' "REPOSITORY FULL TEXT DUMP"
            printf '%s\n' \
              "===================================================================================================="
            printf '\n'
            printf 'Repository: %s\n' "${GITHUB_REPOSITORY}"
            printf 'Branch or ref: %s\n' "${GITHUB_REF_NAME}"
            printf 'Commit SHA: %s\n' "${GITHUB_SHA}"
            printf 'Tracked files: %s\n' "$tracked_count"
            printf 'Included text files: %s\n' "$included_count"
            printf 'Skipped files: %s\n' "$skipped_count"
            printf '\n'

            printf '%s\n' \
              "===================================================================================================="
            printf '%s\n' "REPOSITORY FILE TREE"
            printf '%s\n' \
              "===================================================================================================="
            printf '\n'

            cat "$FILE_LIST"

            printf '\n'
            printf '%s\n' \
              "===================================================================================================="
            printf '%s\n' "INCLUDED TEXT FILES"
            printf '%s\n' \
              "===================================================================================================="
            printf '\n'

            if [ -s "$INCLUDED_LIST" ]; then
              cat "$INCLUDED_LIST"
            else
              printf '%s\n' "[NO TEXT FILES INCLUDED]"
            fi

            printf '\n'
            printf '%s\n' \
              "===================================================================================================="
            printf '%s\n' "SKIPPED FILES"
            printf '%s\n' \
              "===================================================================================================="
            printf '\n'

            if [ -s "$SKIPPED_LIST" ]; then
              cat "$SKIPPED_LIST"
            else
              printf '%s\n' "[NONE]"
            fi

            printf '\n'
            printf '%s\n' \
              "===================================================================================================="
            printf '%s\n' "FILE CONTENTS"
            printf '%s\n' \
              "===================================================================================================="
            printf '\n'
          } > "$OUTPUT_FILE"

          file_number=0

          while IFS= read -r file_path; do
            if [ -z "$file_path" ]; then
              continue
            fi

            file_number=$((file_number + 1))

            {
              printf '\n'
              printf '%s\n' \
                "####################################################################################################"
              printf 'FILE %s/%s: %s\n' \
                "$file_number" \
                "$included_count" \
                "$file_path"
              printf '%s\n' \
                "####################################################################################################"
              printf '\n'

              if [ -s "$file_path" ]; then
                cat "$file_path"
              else
                printf '%s\n' "[EMPTY FILE]"
              fi

              printf '\n'
              printf 'END OF FILE: %s\n' "$file_path"
              printf '\n'
            } >> "$OUTPUT_FILE"
          done < "$INCLUDED_LIST"

          echo "Repository export completed."
          echo "Tracked files: $tracked_count"
          echo "Included text files: $included_count"
          echo "Skipped files: $skipped_count"

      - name: Validate generated dump
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "REPO_FULL_DUMP.txt" ]; then
            echo "ERROR: REPO_FULL_DUMP.txt was not generated."
            exit 1
          fi

          if [ ! -s "REPO_FULL_DUMP.txt" ]; then
            echo "ERROR: REPO_FULL_DUMP.txt is empty."
            exit 1
          fi

          echo "REPO_FULL_DUMP.txt generated successfully."
          ls -lh REPO_FULL_DUMP.txt
          wc -l REPO_FULL_DUMP.txt
          head -n 30 REPO_FULL_DUMP.txt

      - name: Commit repository dump
        shell: bash
        run: |
          set -euo pipefail

          echo "Current Git branch:"
          git branch --show-current

          echo "Generated file information:"
          ls -lh REPO_FULL_DUMP.txt
          wc -l REPO_FULL_DUMP.txt

          echo "Checking whether Git ignore rules match the output:"
          git check-ignore -v REPO_FULL_DUMP.txt || true

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f REPO_FULL_DUMP.txt

          echo "Git status after adding output:"
          git status --short

          if git diff --cached --quiet; then
            echo "No repository dump changes to commit."
          else
            git commit -m "docs: update repository full dump"
          fi

          echo "Pushing repository dump to main branch."
          git push origin HEAD:main

          echo "Push completed successfully."
