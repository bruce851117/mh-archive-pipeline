name: Generate Daily Gemini Digest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: financialjuice-daily-digest
  cancel-in-progress: false

jobs:
  generate-digest:
    name: Generate daily digest and web data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Generate daily Gemini digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          PYTHONUNBUFFERED: "1"
        run: python daily_digest.py

      - name: Commit generated digest files
        if: success()
        run: |
          if git status --porcelain -- data | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update daily Gemini digest"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No generated data changes to commit."
          fi

      - name: Upload Gemini debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-digest-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            data/debug/gemini_response_*.txt
            data/debug/gemini_response_*.json
            data/debug/latest_gemini_response.txt
            data/debug/latest_gemini_response_debug.json
          if-no-files-found: warn
          retention-days: 7
